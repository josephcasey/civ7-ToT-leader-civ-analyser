name: Deploy to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g surge

      - run: surge . civ7-abilities.surge.sh --token ${{ secrets.SURGE_TOKEN }}

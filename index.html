<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civ VII — Leader &amp; Civ Ability Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:       #0f1320;
      --bg-panel:      #1a1f2e;
      --bg-card:       #212840;
      --bg-card-hover: #2a3255;
      --border:        #2e3554;
      --border-light:  #3d4a6e;
      --text:          #e8ecf4;
      --text-muted:    #8892b0;
      --text-dim:      #5a6380;
      --gold:          #c9a84c;
      --gold-light:    #e2c577;
      --gold-bg:       rgba(201,168,76,0.12);
      --teal:          #4ca89a;
      --teal-light:    #6ec8bb;
      --teal-bg:       rgba(76,168,154,0.12);
      --purple:        #8b5cf6;
      --purple-light:  #a78bfa;
      --purple-bg:     rgba(139,92,246,0.12);
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   16px;
      --radius-full: 9999px;
      --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
      --transition:  0.15s ease;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
    }
    body { display: flex; flex-direction: column; }

    /* ─── Loading ───────────────────────────────────────────── */
    #loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; gap: 20px; color: var(--text-muted);
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Error ─────────────────────────────────────────────── */
    #error-msg {
      display: none;
      color: #f87171; background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--radius-md);
      padding: 16px 20px; font-size: 0.82rem; margin: 20px;
    }

    /* ─── App Shell ─────────────────────────────────────────── */
    #app { display: none; flex-direction: column; flex: 1; overflow: hidden; }

    /* ─── Header ────────────────────────────────────────────── */
    .site-header {
      background: linear-gradient(135deg, #12172a 0%, #1a1f2e 60%, #16213a 100%);
      border-bottom: 1px solid var(--border);
      padding: 14px 22px;
      flex-shrink: 0;
    }
    .site-header h1 {
      font-size: 1.05rem; font-weight: 700;
      letter-spacing: 0.04em; color: var(--gold-light);
      display: flex; align-items: center; gap: 10px;
    }
    .site-header h1 .subtitle {
      font-size: 0.7rem; font-weight: 400;
      color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* ─── Layout ────────────────────────────────────────────── */
    .layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    /* ─── Left Pane ─────────────────────────────────────────── */
    .left-pane {
      width: 288px; flex-shrink: 0;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--bg-panel);
      padding: 14px 11px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .left-pane::-webkit-scrollbar { width: 4px; }
    .left-pane::-webkit-scrollbar-track { background: transparent; }
    .left-pane::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    .pane-section-header {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 10px;
    }
    .step-num {
      width: 17px; height: 17px; border-radius: 50%;
      background: var(--gold); color: #0f1320;
      font-size: 0.6rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .step-num.teal { background: var(--teal); }

    /* ─── Leader Grid (sidebar, 2-col) ──────────────────────── */
    .leader-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .leader-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 9px 6px 7px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition),
                  background var(--transition), box-shadow var(--transition);
      position: relative; user-select: none;
    }
    .leader-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-light);
      transform: translateY(-1px);
      box-shadow: var(--shadow-card);
    }
    .leader-card.selected {
      border-color: var(--gold);
      background: rgba(201,168,76,0.08);
      box-shadow: 0 0 0 1px var(--gold);
    }

    .portrait-wrap {
      width: 50px; height: 50px;
      border-radius: 50%; overflow: hidden;
      border: 2px solid var(--border-light);
      transition: border-color var(--transition), box-shadow var(--transition);
      flex-shrink: 0;
    }
    .leader-card:hover .portrait-wrap,
    .leader-card.selected .portrait-wrap {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(201,168,76,0.3);
    }
    .portrait-wrap img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
    }
    .portrait-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg-card-hover), var(--border));
      font-size: 1.1rem; color: var(--gold); font-weight: 700;
    }

    .leader-name {
      font-size: 0.58rem; font-weight: 600;
      text-align: center; color: var(--text); line-height: 1.3;
    }
    .selected-check {
      position: absolute; top: 5px; right: 5px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--gold);
      display: none; align-items: center; justify-content: center;
    }
    .leader-card.selected .selected-check { display: flex; }
    .selected-check svg { width: 8px; height: 8px; fill: #0f1320; }

    /* ─── Civ Pane ──────────────────────────────────────────── */
    #civ-pane-section { display: none; }

    .civ-legend {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 7px;
      font-size: 0.59rem; color: var(--text-muted); flex-wrap: wrap;
    }
    .civ-legend-item { display: flex; align-items: center; gap: 4px; }
    .civ-legend-swatch {
      width: 8px; height: 8px; border-radius: 2px;
      border: 1px solid var(--gold); background: transparent;
    }

    .civ-list { display: flex; flex-direction: column; gap: 2px; }

    .civ-item {
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 5px 8px;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background var(--transition), border-color var(--transition);
      user-select: none;
    }
    .civ-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-light);
    }
    .civ-item.selected {
      background: rgba(76,168,154,0.08);
      border-color: var(--teal);
    }
    .civ-item.has-syncretism { border-color: rgba(201,168,76,0.25); }
    .civ-item.has-syncretism:hover { border-color: var(--gold); }
    .civ-item.has-syncretism.selected { border-color: var(--teal); }

    .civ-item-name {
      font-size: 0.72rem; font-weight: 500; color: var(--text); flex: 1;
    }
    .civ-item-right {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    }
    .sync-star-sm { font-size: 0.62rem; color: var(--gold); line-height: 1; }

    /* ─── Age Badge ─────────────────────────────────────────── */
    .age-badge {
      display: inline-flex; align-items: center;
      padding: 1px 5px; border-radius: var(--radius-full);
      font-size: 0.56rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap;
    }
    .age-badge.antiquity  { background: var(--gold-bg);   color: var(--gold-light);   border: 1px solid rgba(201,168,76,0.3); }
    .age-badge.exploration{ background: var(--teal-bg);   color: var(--teal-light);   border: 1px solid rgba(76,168,154,0.3); }
    .age-badge.modern     { background: var(--purple-bg); color: var(--purple-light); border: 1px solid rgba(139,92,246,0.3); }

    /* ─── Right Pane ────────────────────────────────────────── */
    .right-pane {
      flex: 1; overflow-y: auto;
      padding: 24px 28px 52px; min-width: 0;
    }
    .right-pane::-webkit-scrollbar { width: 5px; }
    .right-pane::-webkit-scrollbar-track { background: transparent; }
    .right-pane::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    /* ─── Empty State ───────────────────────────────────────── */
    .right-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 55vh; gap: 10px; text-align: center;
    }
    .right-empty-icon { font-size: 2.4rem; opacity: 0.25; }
    .right-empty-title { font-size: 0.86rem; font-weight: 600; color: var(--text-muted); }
    .right-empty-sub { font-size: 0.71rem; color: var(--text-dim); }

    /* ─── Preview Badge ─────────────────────────────────────── */
    .preview-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 12px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: var(--radius-full);
      font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--purple-light);
      margin-bottom: 14px;
    }

    /* ─── Detail Content ────────────────────────────────────── */
    .detail-content { max-width: 700px; }

    .detail-block {
      padding: 18px 22px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
      transition: border-color 0.2s, background 0.2s;
    }
    .detail-block.is-preview {
      border-color: rgba(139,92,246,0.35);
      background: rgba(139,92,246,0.04);
    }

    .detail-block-label {
      font-size: 0.59rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-dim); margin-bottom: 12px;
    }

    /* Leader detail */
    .leader-detail-header { display: flex; align-items: center; gap: 16px; }
    .leader-detail-portrait {
      width: 70px; height: 70px; border-radius: 50%;
      overflow: hidden; border: 2.5px solid var(--gold);
      box-shadow: 0 0 14px rgba(201,168,76,0.25); flex-shrink: 0;
    }
    .leader-detail-portrait img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
    }
    .leader-detail-name {
      font-size: 1.18rem; font-weight: 700; color: var(--text); margin-bottom: 2px;
    }
    .ability-name-row {
      font-size: 0.76rem; font-weight: 600; color: var(--gold); margin-bottom: 7px;
    }
    .ability-desc {
      font-size: 0.79rem; color: var(--text-muted);
      line-height: 1.65; white-space: pre-line;
    }

    /* Civ detail */
    .civ-detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .civ-detail-icon {
      width: 42px; height: 42px; border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--bg-card-hover), var(--border));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; border: 1px solid var(--border-light); flex-shrink: 0;
    }
    .civ-detail-name { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }

    /* Traditions */
    .tradition-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid var(--border);
    }
    .tradition-row:last-child { border-bottom: none; }
    .tradition-content { flex: 1; }
    .tradition-name { font-size: 0.79rem; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .tradition-desc { font-size: 0.74rem; color: var(--text-muted); line-height: 1.6; white-space: pre-line; }

    /* Syncretism */
    .sync-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .sync-pill {
      padding: 3px 10px; border-radius: var(--radius-full);
      font-size: 0.69rem; font-weight: 600;
      background: var(--teal-bg); color: var(--teal-light);
      border: 1px solid rgba(76,168,154,0.3);
    }
    .sync-pill.from-leader { background: rgba(201,168,76,0.1); color: var(--gold-light); border-color: rgba(201,168,76,0.3); }
    .sync-pill.from-both {
      background: linear-gradient(90deg, rgba(201,168,76,0.12), rgba(76,168,154,0.12));
      color: #d4c07a; border-color: rgba(201,168,76,0.4);
    }
    .sync-source-note { font-size: 0.64rem; color: var(--text-dim); margin-top: 8px; }

    .empty-state { font-size: 0.75rem; color: var(--text-dim); font-style: italic; }

    /* Civ prompt */
    .civ-prompt {
      text-align: center; padding: 18px 0 4px;
      font-size: 0.74rem; color: var(--text-dim); font-style: italic;
    }

    /* Reset */
    .btn-reset {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px;
      background: transparent;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-full);
      color: var(--text-muted);
      font-family: inherit; font-size: 0.7rem; font-weight: 600;
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition), background var(--transition);
      margin-top: 6px;
    }
    .btn-reset:hover { border-color: var(--gold); color: var(--gold-light); background: var(--gold-bg); }

    /* ─── Footer ────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 9px 24px;
      text-align: center; font-size: 0.62rem;
      color: var(--text-dim); flex-shrink: 0;
    }

    /* ─── Responsive ────────────────────────────────────────── */
    @media (max-width: 768px) {
      html, body { height: auto; overflow: visible; }
      #app { overflow: visible; height: auto; }
      .layout { flex-direction: column; overflow: visible; }
      .left-pane { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .leader-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
      .right-pane { padding: 16px 14px 40px; }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <span>Loading data…</span>
  </div>

  <div id="error-msg"></div>

  <div id="app">
    <header class="site-header">
      <h1>⚔ Civilization VII <span class="subtitle">— Leader &amp; Civ Ability Browser</span></h1>
    </header>

    <div class="layout">
      <!-- ── Left Pane ── -->
      <aside class="left-pane">
        <div id="leader-pane-section">
          <div class="pane-section-header">
            <span class="step-num">1</span> Leaders
          </div>
          <div class="leader-grid" id="leader-grid"></div>
        </div>

        <div id="civ-pane-section">
          <div class="pane-section-header">
            <span class="step-num teal">2</span> Civilizations
          </div>
          <div class="civ-legend">
            <span class="civ-legend-item">
              <span class="civ-legend-swatch"></span> Syncretism available
            </span>
            <span class="civ-legend-item">
              <span class="sync-star-sm">✦</span> Leader can sync
            </span>
          </div>
          <div class="civ-list" id="civ-grid"></div>
        </div>
      </aside>

      <!-- ── Right Pane ── -->
      <div class="right-pane">
        <div id="detail-area"></div>
      </div>
    </div>

    <footer>
      Data extracted from Civ VII 1.4.0 (Test of Time) game database · Images © 2K Games via Civilization Wiki
    </footer>
  </div>

  <script>
  // ─── Embedded Data ───────────────────────────────────────────────────────────

  const PORTRAIT_URLS = {"Amina":"https://static.wikia.nocookie.net/civilization/images/1/14/Amina_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20251218081610","Ada Lovelace":"https://static.wikia.nocookie.net/civilization/images/7/72/Ada_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250124234454","Alexander":"https://static.wikia.nocookie.net/civilization/images/b/bb/Alexander_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250124234829","Ashoka, World Conqueror":"https://static.wikia.nocookie.net/civilization/images/8/8e/Ashoka%2C_World_Conqueror_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250124235355","Ashoka, World Renouncer":"https://static.wikia.nocookie.net/civilization/images/b/b7/Ashoka%2C_World_Renouncer_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250124235357","Augustus":"https://static.wikia.nocookie.net/civilization/images/9/97/Augustus_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250124235737","Benjamin Franklin":"https://static.wikia.nocookie.net/civilization/images/7/79/Benjamin_Franklin_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250124235945","Catherine the Great":"https://static.wikia.nocookie.net/civilization/images/6/61/Catherine_head_portrait_%28neutral%29_%28Civ7%29.png/revision/latest?cb=20250125000358","Charlemagne":"https://static.wikia.nocookie.net/civilization/images/f/fc/Charlemagne_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125000706","Confucius":"https://static.wikia.nocookie.net/civilization/images/b/b1/Confucius_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125001043","Edward Teach":"https://static.wikia.nocookie.net/civilization/images/a/a0/Edward_Teach_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125001406","Friedrich, Baroque":"https://static.wikia.nocookie.net/civilization/images/9/93/Friedrich_%28Baroque%29_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125002110","Friedrich, Oblique":"https://static.wikia.nocookie.net/civilization/i ation/images/d/dc/Napoleon_Emperor_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125010139","Napoleon, Revolutionary":"https://static.wikia.nocookie.net/civilization/images/9/9c/Napoleon_Revolutionary_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125010145","Pachacuti":"https://static.wikia.nocookie.net/civilization/images/e/e2/Pachacuti_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125010500","Sayyida al Hurra":"https://static.wikia.nocookie.net/civilization/images/d/d7/Sayyida_al_Hurra_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125010809","Tecumseh":"https://static.wikia.nocookie.net/civilization/images/d/d6/Tecumseh_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125011044","Trung Trac":"https://static.wikia.nocookie.net/civilization/images/8/8f/Trung_Trac_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125011440","Simón Bolívar":"https://static.wikia.nocookie.net/civilization/images/6/68/Sim%C3%B3n_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125010944","Xerxes, King of Kings":"https://static.wikia.nocookie.net/civilization/images/1/1a/Xerxes_King_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125011719","Xerxes, the Achaemenid":"https://static.wikia.nocookie.net/civilization/images/4/43/Xerxes_Achaemenid_portrait_neutral_%28Civ7%29.png/revision/latest?cb=20250125011726"};

  const APEX_AGES = {"Abbasid":"Exploration","Aksum":"Antiquity","America":"Modern","Assyria":"Antiquity","Buganda":"Modern","Bulgaria":"Exploration","Carthage":"Antiquity","Chola":"Exploration","Đại Việt":"Exploration","Egypt":"Antiquity","French Empire":"Modern","Great Britain":"Modern","Greece":"Antiquity","Han":"Antiquity","Hawai'i":"Exploration","Iceland":"Exploration","Inca":"Exploration","Khmer":"Antiquity","Majapahit":"Exploration","Maurya":"Antiquity","Maya":"Antiquity","Meiji Japan":"Modern","Mexico":"Modern","Ming":"Exploration","Mississippian":"Antiquity","Mongolia":"Exploration","Mughal":"Modern","Nepal":"Modern","Norman":"Exploration","Ottomans":"Modern","Achaemenid Persia":"Antiquity","Republic of Pirates":"Exploration","Prussia":"Modern","Qajar":"Modern","Qing":"Modern","Rome":"Antiquity","Russia":"Modern","Shawnee":"Exploration","Siam":"Modern","Silla Korea":"Antiquity","Songhai":"Exploration","Spain":"Exploration","Tonga":"Antiquity"};

  // ─── CSV Parser ──────────────────────────────────────────────────────────────

  function parseCSV(text) {
    const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    if (!lines.length) return [];
    const headers = parseCSVRow(lines[0]);
    const result = [];
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const values = parseCSVRow(line);
      const row = {};
      headers.forEach((h, idx) => { row[h] = values[idx] !== undefined ? values[idx] : ''; });
      result.push(row);
    }
    return result;
  }

  function parseCSVRow(line) {
    const result = []; let cur = ''; let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
        else { inQuote = !inQuote; }
      } else if (ch === ',' && !inQuote) {
        result.push(cur); cur = '';
      } else {
        cur += ch;
      }
    }
    result.push(cur);
    return result;
  }

  // ─── Helpers ─────────────────────────────────────────────────────────────────

  function ageClass(age) {
    if (!age) return '';
    const a = age.toLowerCase();
    if (a === 'antiquity')  return 'antiquity';
    if (a === 'exploration') return 'exploration';
    if (a === 'modern')     return 'modern';
    return '';
  }

  function ageBadge(age) {
    if (!age) return '';
    return `<span class="age-badge ${ageClass(age)}">${escHtml(age)}</span>`;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function splitList(str) {
    if (!str || !str.trim()) return [];
    return str.split(',').map(s => s.trim()).filter(Boolean);
  }

  function initials(name) {
    return name.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
  }

  // ─── State ───────────────────────────────────────────────────────────────────

  let allRows = [], leaderSyncRows = [];
  let leaders = {}, civs = {}, leaderSyncMap = {};
  let selectedLeader = null, selectedCiv = null;
  let hoveredLeader  = null, hoveredCiv  = null;

  // ─── Load & Process ──────────────────────────────────────────────────────────

  async function loadData() {
    const [unifiedText, syncText] = await Promise.all([
      fetch('civ7_unified.csv').then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); }),
      fetch('civ7_leader_syncretism.csv').then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); }),
    ]);
    allRows = parseCSV(unifiedText);
    leaderSyncRows = parseCSV(syncText);
  }

  function processData() {
    for (const row of allRows) {
      if (row.kind !== 'leader') continue;
      if (row.row_type === 'Unique Ability') {
        leaders[row.name] = {
          abilityName: row.ability_or_tradition_name,
          desc: row.description_clean,
          syncretismOptions: splitList(row.syncretism_options),
        };
      }
    }

    for (const row of allRows) {
      if (row.kind !== 'civilization') continue;
      if (!civs[row.name]) {
        civs[row.name] = {
          abilityName: '', apexDesc: '',
          apexAge: APEX_AGES[row.name] || '',
          traditions: [], civSyncOptions: [],
        };
      }
      if (row.row_type === 'Unique Ability') {
        civs[row.name].abilityName    = row.ability_or_tradition_name;
        civs[row.name].apexDesc       = row.description_clean;
        civs[row.name].civSyncOptions = splitList(row.syncretism_options);
      } else if (row.row_type === 'Self-Syncretism Tradition') {
        civs[row.name].traditions.push({
          name: row.ability_or_tradition_name,
          age:  row.age,
          desc: row.description_clean,
        });
      }
    }

    const AGE_ORDER = { Antiquity: 0, Exploration: 1, Apex: 2, Modern: 3 };
    for (const civ of Object.values(civs)) {
      civ.traditions.sort((a, b) => (AGE_ORDER[a.age] ?? 99) - (AGE_ORDER[b.age] ?? 99));
    }

    for (const row of leaderSyncRows) {
      const ln = row.leader_name;
      if (!leaderSyncMap[ln]) leaderSyncMap[ln] = [];
      leaderSyncMap[ln].push(row.syncretism_civ_name);
    }
  }

  // ─── Render Right Pane ───────────────────────────────────────────────────────

  function renderRightPane() {
    const detail = document.getElementById('detail-area');

    const activeLeader = hoveredLeader ?? selectedLeader;
    const activeCiv    = hoveredCiv    ?? selectedCiv;
    const leaderIsPreview = !!hoveredLeader && hoveredLeader !== selectedLeader;
    const civIsPreview    = !!hoveredCiv    && hoveredCiv    !== selectedCiv;

    if (!activeLeader) {
      detail.innerHTML = `
        <div class="right-empty">
          <div class="right-empty-icon">⚔</div>
          <div class="right-empty-title">Select or hover a leader to begin</div>
          <div class="right-empty-sub">Click to lock in a selection · Hover to preview abilities</div>
        </div>`;
      return;
    }

    let html = '';

    if (leaderIsPreview || civIsPreview) {
      const who = leaderIsPreview && civIsPreview ? 'Leader &amp; Civilization'
                : leaderIsPreview ? 'Leader' : 'Civilization';
      html += `<div class="preview-badge">Previewing ${who} — click to select</div>`;
    }

    html += `<div class="detail-content">`;

    // ── Leader block ──
    const leader = leaders[activeLeader];
    if (leader) {
      const portraitUrl = PORTRAIT_URLS[activeLeader];
      const portraitInner = portraitUrl
        ? `<img src="${escHtml(portraitUrl)}" alt="${escHtml(activeLeader)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="portrait-fallback" style="display:none">${escHtml(initials(activeLeader))}</div>`
        : `<div class="portrait-fallback">${escHtml(initials(activeLeader))}</div>`;

      html += `
        <div class="detail-block${leaderIsPreview ? ' is-preview' : ''}">
          <div class="detail-block-label">Leader</div>
          <div class="leader-detail-header">
            <div class="leader-detail-portrait">${portraitInner}</div>
            <div>
              <div class="leader-detail-name">${escHtml(activeLeader)}</div>
              <div class="ability-name-row">⚡ ${escHtml(leader.abilityName)}</div>
              <div class="ability-desc">${escHtml(leader.desc)}</div>
            </div>
          </div>
        </div>`;
    }

    // ── Civ block ──
    if (activeCiv) {
      const civ = civs[activeCiv];

      html += `
        <div class="detail-block${civIsPreview ? ' is-preview' : ''}">
          <div class="detail-block-label">Civilization</div>
          <div class="civ-detail-header">
            <div class="civ-detail-icon">🏛</div>
            <div>
              <div class="civ-detail-name">${escHtml(activeCiv)}</div>
              ${ageBadge(civ.apexAge)}
            </div>
          </div>
          <div class="ability-name-row">⚡ ${escHtml(civ.abilityName)}</div>
          <div class="ability-desc">${escHtml(civ.apexDesc)}</div>
        </div>`;

      // Traditions
      const traditions = civ.traditions.filter(t => {
        const a = (t.age || '').toLowerCase();
        return a !== 'apex' && t.desc && t.desc.trim();
      });
      if (traditions.length) {
        html += `
          <div class="detail-block${civIsPreview ? ' is-preview' : ''}">
            <div class="detail-block-label">Cross-Age Abilities (Self-Syncretism Traditions)</div>
            ${traditions.map(t => `
              <div class="tradition-row">
                <div style="padding-top:2px">${ageBadge(t.age)}</div>
                <div class="tradition-content">
                  <div class="tradition-name">${escHtml(t.name)}</div>
                  <div class="tradition-desc">${escHtml(t.desc)}</div>
                </div>
              </div>`).join('')}
          </div>`;
      }

      // Syncretism — only when both firmly selected (not a hover preview)
      if (!leaderIsPreview && !civIsPreview && selectedLeader && selectedCiv) {
        const leaderSyncSet = new Set(leaderSyncMap[selectedLeader] || []);
        const civSyncSet    = new Set(civ.civSyncOptions);
        const allSync = new Set([...leaderSyncSet, ...civSyncSet]);
        allSync.delete(selectedCiv);

        const pills = [...allSync].sort().map(n => {
          const fl = leaderSyncSet.has(n), fc = civSyncSet.has(n);
          const cls = fl && fc ? 'sync-pill from-both' : fl ? 'sync-pill from-leader' : 'sync-pill';
          return `<span class="${cls}">${escHtml(n)}</span>`;
        }).join('');

        const syncContent = allSync.size > 0
          ? `<div class="sync-pills">${pills}</div>
             <div class="sync-source-note">
               <span style="color:var(--gold-light)">Gold</span> = from leader &nbsp;|&nbsp;
               <span style="color:var(--teal-light)">Teal</span> = from civilization &nbsp;|&nbsp;
               <span style="color:#d4c07a">Mixed</span> = from both
             </div>`
          : `<div class="empty-state">No syncretism options for this combination.</div>`;

        html += `
          <div class="detail-block">
            <div class="detail-block-label">Syncretism Options</div>
            ${syncContent}
          </div>`;

        html += `
          <button class="btn-reset" id="btn-reset">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.418A6 6 0 1 1 8 2v1z"/>
              <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
            </svg>
            Start Over
          </button>`;
      }
    } else if (selectedLeader && !hoveredLeader) {
      html += `<div class="civ-prompt">Select or hover a civilization to see its abilities</div>`;
    }

    html += `</div>`;
    detail.innerHTML = html;

    const resetBtn = document.getElementById('btn-reset');
    if (resetBtn) resetBtn.addEventListener('click', resetAll);
  }

  // ─── Render Leaders ──────────────────────────────────────────────────────────

  function renderLeaders() {
    const grid = document.getElementById('leader-grid');
    grid.innerHTML = '';
    for (const name of Object.keys(leaders).sort()) {
      const card = document.createElement('div');
      card.className = 'leader-card' + (selectedLeader === name ? ' selected' : '');
      card.dataset.leader = name;

      const url = PORTRAIT_URLS[name];
      const portraitInner = url
        ? `<img src="${escHtml(url)}" alt="${escHtml(name)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="portrait-fallback" style="display:none">${escHtml(initials(name))}</div>`
        : `<div class="portrait-fallback">${escHtml(initials(name))}</div>`;

      card.innerHTML = `
        <div class="portrait-wrap">${portraitInner}</div>
        <div class="leader-name">${escHtml(name)}</div>
        <div class="selected-check">
          <svg viewBox="0 0 12 10">
            <polyline points="1,5 4.5,8.5 11,1" stroke="#0f1320" stroke-width="2"
                      fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>`;

      card.addEventListener('click', () => selectLeader(name));
      card.addEventListener('mouseenter', () => { hoveredLeader = name; renderRightPane(); });
      card.addEventListener('mouseleave', () => { hoveredLeader = null; renderRightPane(); });
      grid.appendChild(card);
    }
  }

  // ─── Render Civs ─────────────────────────────────────────────────────────────

  function renderCivs() {
    const list = document.getElementById('civ-grid');
    list.innerHTML = '';
    const leaderSyncCivs = new Set(leaderSyncMap[selectedLeader] || []);

    for (const name of Object.keys(civs).sort()) {
      const civ = civs[name];
      const hasSync  = leaderSyncCivs.has(name);
      const isSelected = selectedCiv === name;

      const item = document.createElement('div');
      item.className = 'civ-item'
        + (isSelected ? ' selected' : '')
        + (hasSync    ? ' has-syncretism' : '');
      item.dataset.civ = name;

      item.innerHTML = `
        <span class="civ-item-name">${escHtml(name)}</span>
        <span class="civ-item-right">
          ${hasSync ? `<span class="sync-star-sm" title="Leader can syncretise with this civ">✦</span>` : ''}
          ${ageBadge(civ.apexAge || 'Unknown')}
        </span>`;

      item.addEventListener('click', () => selectCiv(name));
      item.addEventListener('mouseenter', () => { hoveredCiv = name; renderRightPane(); });
      item.addEventListener('mouseleave', () => { hoveredCiv = null; renderRightPane(); });
      list.appendChild(item);
    }

    document.getElementById('civ-pane-section').style.display = '';
  }

  // ─── Selection ───────────────────────────────────────────────────────────────

  function selectLeader(name) {
    selectedLeader = name;
    selectedCiv    = null;
    hoveredLeader  = null;
    hoveredCiv     = null;
    renderLeaders();
    renderCivs();
    renderRightPane();
  }

  function selectCiv(name) {
    selectedCiv = name;
    hoveredCiv  = null;
    document.querySelectorAll('.civ-item').forEach(c => {
      c.classList.toggle('selected', c.dataset.civ === name);
    });
    renderRightPane();
  }

  function resetAll() {
    selectedLeader = null; selectedCiv = null;
    hoveredLeader  = null; hoveredCiv  = null;
    document.getElementById('civ-pane-section').style.display = 'none';
    renderLeaders();
    renderRightPane();
  }

  // ─── Init ─────────────────────────────────────────────────────────────────────

  async function init() {
    try {
      await loadData();
      processData();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('civ-pane-section').style.display = 'none';
      renderLeaders();
      renderRightPane();
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'block';
      errEl.textContent = `Failed to load data: ${err.message}. Make sure civ7_unified.csv and civ7_leader_syncretism.csv are alongside this file.`;
    }
  }

  init();
  </script>
</body>

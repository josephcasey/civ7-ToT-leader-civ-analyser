<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civ VII — Leader &amp; Civ Ability Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:       #0f1320;
      --bg-panel:      #1a1f2e;
      --bg-card:       #212840;
      --bg-card-hover: #2a3255;
      --border:        #2e3554;
      --border-light:  #3d4a6e;
      --text:          #e8ecf4;
      --text-muted:    #8892b0;
      --text-dim:      #5a6380;
      --gold:          #c9a84c;
      --gold-light:    #e2c577;
      --gold-bg:       rgba(201,168,76,0.12);
      --teal:          #4ca89a;
      --teal-light:    #6ec8bb;
      --teal-bg:       rgba(76,168,154,0.12);
      --purple:        #8b5cf6;
      --purple-light:  #a78bfa;
      --purple-bg:     rgba(139,92,246,0.12);
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
      --radius-full: 9999px;
      --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
      --transition:  0.15s ease;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      display: flex; flex-direction: column;
    }

    /* ─── Loading ───────────────────────────────────────────── */
    #loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; gap: 20px; color: var(--text-muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Error ─────────────────────────────────────────────── */
    #error-msg {
      display: none; color: #f87171;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--radius-md);
      padding: 14px 18px; font-size: 0.8rem; margin: 16px;
    }

    /* ─── App Shell ─────────────────────────────────────────── */
    #app { display: none; flex-direction: column; flex: 1; overflow: hidden; }

    /* ─── Header ────────────────────────────────────────────── */
    .site-header {
      background: linear-gradient(135deg, #12172a 0%, #1a1f2e 60%, #16213a 100%);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .site-header h1 {
      font-size: 0.95rem; font-weight: 700;
      letter-spacing: 0.03em; color: var(--gold-light);
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .site-header h1 .subtitle {
      font-size: 0.66rem; font-weight: 400;
      color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase;
    }
    .btn-reset {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 12px; background: transparent;
      border: 1px solid var(--border-light); border-radius: var(--radius-full);
      color: var(--text-muted); font-family: inherit;
      font-size: 0.66rem; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: border-color var(--transition), color var(--transition), background var(--transition);
    }
    .btn-reset:hover { border-color: var(--gold); color: var(--gold-light); background: var(--gold-bg); }
    .btn-reset svg { width: 10px; height: 10px; }

    /* ─── Ability Pane (top strip) ──────────────────────────── */
    .ability-pane {
      display: flex; flex-shrink: 0;
      border-bottom: 2px solid var(--border);
      /* height is content-driven, but clamped */
      max-height: 38vh;
      overflow: hidden;
    }

    .ability-half {
      flex: 1; min-width: 0;
      overflow-y: auto; padding: 12px 14px;
    }
    .ability-half::-webkit-scrollbar { width: 3px; }
    .ability-half::-webkit-scrollbar-track { background: transparent; }
    .ability-half::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    .ability-half + .ability-half { border-left: 1px solid var(--border); }

    /* empty state inside a half */
    .half-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; min-height: 80px;
      gap: 5px; text-align: center; color: var(--text-dim);
    }
    .half-empty-icon { font-size: 1.4rem; opacity: 0.2; }
    .half-empty-label { font-size: 0.66rem; }

    /* ─── Preview badge ─────────────────────────────────────── */
    .preview-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px;
      background: rgba(139,92,246,0.1);
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: var(--radius-full);
      font-size: 0.56rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--purple-light); margin-bottom: 7px;
    }

    /* ─── Leader detail content ─────────────────────────────── */
    .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
    .detail-portrait {
      width: 46px; height: 46px; border-radius: 50%;
      overflow: hidden; border: 2px solid var(--gold);
      box-shadow: 0 0 10px rgba(201,168,76,0.2); flex-shrink: 0;
    }
    .detail-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .detail-portrait-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg-card-hover), var(--border));
      font-size: 0.95rem; color: var(--gold); font-weight: 700;
    }

    /* civ portrait in detail pane — rounded square */
    .detail-portrait.civ-portrait { border-radius: var(--radius-md); border-color: var(--teal); box-shadow: 0 0 10px rgba(76,168,154,0.2); }

    .detail-name { font-size: 0.88rem; font-weight: 700; color: var(--text); margin-bottom: 1px; }
    .ability-name-row { font-size: 0.68rem; font-weight: 600; color: var(--gold); margin-bottom: 5px; }
    .ability-name-row.teal { color: var(--teal-light); }
    .ability-desc { font-size: 0.72rem; color: var(--text-muted); line-height: 1.6; white-space: pre-line; }

    /* ─── Age Badge ─────────────────────────────────────────── */
    .age-badge {
      display: inline-flex; align-items: center;
      padding: 1px 5px; border-radius: var(--radius-full);
      font-size: 0.54rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap;
    }
    .age-badge.antiquity  { background: var(--gold-bg);   color: var(--gold-light);   border: 1px solid rgba(201,168,76,0.3); }
    .age-badge.exploration{ background: var(--teal-bg);   color: var(--teal-light);   border: 1px solid rgba(76,168,154,0.3); }
    .age-badge.modern     { background: var(--purple-bg); color: var(--purple-light); border: 1px solid rgba(139,92,246,0.3); }

    /* Traditions (compact, in civ half) */
    .section-sublabel {
      font-size: 0.54rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-dim); margin: 8px 0 4px;
    }
    .tradition-row {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 5px 0; border-bottom: 1px solid var(--border);
    }
    .tradition-row:last-child { border-bottom: none; }
    .tradition-name { font-size: 0.68rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .tradition-desc { font-size: 0.64rem; color: var(--text-muted); line-height: 1.55; white-space: pre-line; }

    /* Syncretism */
    .sync-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .sync-pill {
      padding: 2px 7px; border-radius: var(--radius-full);
      font-size: 0.62rem; font-weight: 600;
      background: var(--teal-bg); color: var(--teal-light);
      border: 1px solid rgba(76,168,154,0.3);
    }
    .sync-pill.from-leader { background: rgba(201,168,76,0.1); color: var(--gold-light); border-color: rgba(201,168,76,0.3); }
    .sync-pill.from-both {
      background: linear-gradient(90deg, rgba(201,168,76,0.12), rgba(76,168,154,0.12));
      color: #d4c07a; border-color: rgba(201,168,76,0.4);
    }
    .sync-source-note { font-size: 0.58rem; color: var(--text-dim); margin-top: 5px; }
    .empty-state { font-size: 0.66rem; color: var(--text-dim); font-style: italic; }

    /* ─── Selection Area (below ability pane) ───────────────── */
    .selection-area {
      flex: 1; display: flex; min-height: 0; overflow: hidden;
    }

    .panel {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .panel + .panel { border-left: 1px solid var(--border); }

    .panel-header {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 10px 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-header-label {
      font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-dim);
    }
    .step-num {
      width: 15px; height: 15px; border-radius: 50%;
      background: var(--gold); color: #0f1320;
      font-size: 0.56rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .step-num.teal { background: var(--teal); }

    /* civ legend inline in header */
    .civ-legend {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.54rem; color: var(--text-dim); margin-left: auto;
    }
    .civ-legend-item { display: flex; align-items: center; gap: 3px; }
    .legend-swatch { width: 6px; height: 6px; border-radius: 1px; border: 1px solid var(--gold); }
    .sync-star-sm { font-size: 0.58rem; color: var(--gold); }

    .panel-scroll {
      flex: 1; overflow-y: auto; padding: 8px;
    }
    .panel-scroll::-webkit-scrollbar { width: 4px; }
    .panel-scroll::-webkit-scrollbar-track { background: transparent; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    /* ─── Tile Grid (leaders & civs share same style) ───────── */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 5px;
    }

    /* ─── Tile Card ─────────────────────────────────────────── */
    .tile-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 6px 4px 5px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition),
                  background var(--transition), box-shadow var(--transition);
      position: relative; user-select: none;
    }
    .tile-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-light);
      transform: translateY(-1px);
      box-shadow: var(--shadow-card);
    }
    .tile-card.leader-selected {
      border-color: var(--gold);
      background: rgba(201,168,76,0.08);
      box-shadow: 0 0 0 1px var(--gold), var(--shadow-card);
    }
    .tile-card.civ-selected {
      border-color: var(--teal);
      background: rgba(76,168,154,0.08);
      box-shadow: 0 0 0 1px var(--teal), var(--shadow-card);
    }
    .tile-card.has-syncretism { border-color: rgba(201,168,76,0.35); }
    .tile-card.has-syncretism:hover { border-color: var(--gold); }
    .tile-card.has-syncretism.civ-selected { border-color: var(--teal); }

    /* tile portrait — circle for leaders, rounded-square for civs */
    .tile-portrait {
      width: 52px; height: 52px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--border-light);
      transition: border-color var(--transition), box-shadow var(--transition);
      flex-shrink: 0; position: relative;
    }
    .tile-card.civ-card .tile-portrait { border-radius: var(--radius-md); }

    .tile-card:hover .tile-portrait { border-color: var(--border-light); }
    .tile-card.leader-selected .tile-portrait { border-color: var(--gold); box-shadow: 0 0 10px rgba(201,168,76,0.3); }
    .tile-card.civ-selected .tile-portrait    { border-color: var(--teal); box-shadow: 0 0 10px rgba(76,168,154,0.25); }

    .tile-portrait img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
      display: block;
    }
    .tile-card.civ-card .tile-portrait img { object-position: center center; }

    .tile-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg-card-hover), var(--border));
      font-size: 1rem; color: var(--gold); font-weight: 700;
    }
    .tile-card.civ-card .tile-fallback { color: var(--teal); }

    .tile-name {
      font-size: 0.57rem; font-weight: 600;
      text-align: center; color: var(--text); line-height: 1.25;
      word-break: break-word; hyphens: auto;
    }

    /* sync star badge on civ tile */
    .tile-sync-star {
      position: absolute; top: -3px; right: -3px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--gold); color: #0f1320;
      font-size: 0.45rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--bg-card);
    }

    /* selection checkmark */
    .tile-check {
      position: absolute; top: 4px; right: 4px;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--gold); display: none;
      align-items: center; justify-content: center;
    }
    .tile-card.civ-selected .tile-check { background: var(--teal); }
    .tile-card.leader-selected .tile-check,
    .tile-card.civ-selected .tile-check { display: flex; }
    .tile-check svg { width: 7px; height: 7px; fill: #0f1320; }

    /* ─── Footer ────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 6px 18px; text-align: center;
      font-size: 0.58rem; color: var(--text-dim); flex-shrink: 0;
    }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      .ability-pane { flex-direction: column; max-height: 50vh; }
      .ability-half + .ability-half { border-left: none; border-top: 1px solid var(--border); }
      .site-header h1 .subtitle { display: none; }
      .civ-legend { display: none; }
    }
  </style>
</head>
<body>

  <div id="loading"><div class="spinner"></div><span>Loading data…</span></div>
  <div id="error-msg"></div>

  <div id="app">

    <!-- ── Header ── -->
    <header class="site-header">
      <h1>⚔ Civilization VII <span class="subtitle">— Leader &amp; Civ Ability Browser</span></h1>
      <button class="btn-reset" id="btn-reset">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.418A6 6 0 1 1 8 2v1z"/>
          <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
        </svg>
        Reset
      </button>
    </header>

    <!-- ── Ability Pane (top) ── -->
    <div class="ability-pane">
      <div class="ability-half" id="leader-detail-area">
        <div class="half-empty">
          <div class="half-empty-icon">👑</div>
          <div class="half-empty-label">Hover or select a leader</div>
        </div>
      </div>
      <div class="ability-half" id="civ-detail-area">
        <div class="half-empty">
          <div class="half-empty-icon">🏛</div>
          <div class="half-empty-label">Hover or select a civilization</div>
        </div>
      </div>
    </div>

    <!-- ── Selection Area (bottom) ── -->
    <div class="selection-area">

      <!-- Leaders panel -->
      <div class="panel">
        <div class="panel-header">
          <span class="step-num">1</span>
          <span class="panel-header-label">Leaders</span>
        </div>
        <div class="panel-scroll">
          <div class="tile-grid" id="leader-grid"></div>
        </div>
      </div>

      <!-- Civs panel -->
      <div class="panel" id="civ-panel">
        <div class="panel-header">
          <span class="step-num teal">2</span>
          <span class="panel-header-label">Civilizations</span>
          <div class="civ-legend">
            <span class="civ-legend-item"><span class="legend-swatch"></span> Syncretism</span>
            <span class="civ-legend-item"><span class="sync-star-sm">✦</span> Leader sync</span>
          </div>
        </div>
        <div class="panel-scroll">
          <div class="tile-grid" id="civ-grid"></div>
        </div>
      </div>

    </div>

    <footer>
      Data extracted from Civ VII 1.4.0 (Test of Time) · Images © 2K Games via Civilization Wiki
    </footer>
  </div>

  <script>
  // ─── Leader Portrait URLs ────────────────────────────────────────────────────

  const APEX_AGES = {"Abbasid":"Exploration","Aksum":"Antiquity","America":"Modern","Assyria":"Antiquity","Buganda":"Modern","Bulgaria":"Exploration","Carthage":"Antiquity","Chola":"Exploration","Đại Việt":"Exploration","Egypt":"Antiquity","French Empire":"Modern","Great Britain":"Modern","Greece":"Antiquity","Han":"Antiquity","Hawai'i":"Exploration","Iceland":"Exploration","Inca":"Exploration","Khmer":"Antiquity","Majapahit":"Exploration","Maurya":"Antiquity","Maya":"Antiquity","Meiji Japan":"Modern","Mexico":"Modern","Ming":"Exploration","Mississippian":"Antiquity","Mongolia":"Exploration","Mughal":"Modern","Nepal":"Modern","Norman":"Exploration","Ottomans":"Modern","Achaemenid Persia":"Antiquity","Republic of Pirates":"Exploration","Prussia":"Modern","Qajar":"Modern","Qing":"Modern","Rome":"Antiquity","Russia":"Modern","Shawnee":"Exploration","Siam":"Modern","Silla Korea":"Antiquity","Songhai":"Exploration","Spain":"Exploration","Tonga":"Antiquity"};

  // ─── CSV Parser ──────────────────────────────────────────────────────────────
  function parseCSV(text) {
    const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    if (!lines.length) return [];
    const headers = parseCSVRow(lines[0]);
    const result = [];
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const values = parseCSVRow(line);
      const row = {};
      headers.forEach((h, idx) => { row[h] = values[idx] !== undefined ? values[idx] : ''; });
      result.push(row);
    }
    return result;
  }
  function parseCSVRow(line) {
    const result = []; let cur = ''; let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
        else { inQuote = !inQuote; }
      } else if (ch === ',' && !inQuote) { result.push(cur); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur);
    return result;
  }

  // ─── Helpers ─────────────────────────────────────────────────────────────────
  function ageClass(age) {
    const a = (age||'').toLowerCase();
    return a === 'antiquity' ? 'antiquity' : a === 'exploration' ? 'exploration' : a === 'modern' ? 'modern' : '';
  }
  function ageBadge(age) {
    if (!age) return '';
    return `<span class="age-badge ${ageClass(age)}">${escHtml(age)}</span>`;
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function splitList(str) {
    if (!str||!str.trim()) return [];
    return str.split(',').map(s=>s.trim()).filter(Boolean);
  }
  function initials(name) {
    return name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  }

  // ─── State ───────────────────────────────────────────────────────────────────
  let allRows=[], leaderSyncRows=[];
  let leaders={}, civs={}, leaderSyncMap={};
  let selectedLeader=null, selectedCiv=null;
  let hoveredLeader=null,  hoveredCiv=null;

  // ─── Load & Process ──────────────────────────────────────────────────────────
  async function loadData() {
    const [u, s] = await Promise.all([
      fetch('civ7_unified.csv').then(r=>{ if(!r.ok) throw new Error(r.statusText); return r.text(); }),
      fetch('civ7_leader_syncretism.csv').then(r=>{ if(!r.ok) throw new Error(r.statusText); return r.text(); }),
    ]);
    allRows=parseCSV(u); leaderSyncRows=parseCSV(s);
  }
  function processData() {
    for (const row of allRows) {
      if (row.kind!=='leader'||row.row_type!=='Unique Ability') continue;
      leaders[row.name]={ abilityName:row.ability_or_tradition_name, desc:row.description_clean, syncretismOptions:splitList(row.syncretism_options) };
    }
    for (const row of allRows) {
      if (row.kind!=='civilization') continue;
      if (!civs[row.name]) civs[row.name]={ abilityName:'', apexDesc:'', apexAge:APEX_AGES[row.name]||'', traditions:[], civSyncOptions:[] };
      if (row.row_type==='Unique Ability') {
        civs[row.name].abilityName=row.ability_or_tradition_name;
        civs[row.name].apexDesc=row.description_clean;
        civs[row.name].civSyncOptions=splitList(row.syncretism_options);
      } else if (row.row_type==='Self-Syncretism Tradition') {
        civs[row.name].traditions.push({ name:row.ability_or_tradition_name, age:row.age, desc:row.description_clean });
      }
    }
    const AGE_ORDER={Antiquity:0,Exploration:1,Apex:2,Modern:3};
    for (const civ of Object.values(civs)) civ.traditions.sort((a,b)=>(AGE_ORDER[a.age]??99)-(AGE_ORDER[b.age]??99));
    for (const row of leaderSyncRows) {
      if (!leaderSyncMap[row.leader_name]) leaderSyncMap[row.leader_name]=[];
      leaderSyncMap[row.leader_name].push(row.syncretism_civ_name);
    }
  }

  // ─── Render: Leader Detail (top-left half) ───────────────────────────────────
  function renderLeaderDetail() {
    const area = document.getElementById('leader-detail-area');
    const active    = hoveredLeader ?? selectedLeader;
    const isPreview = !!hoveredLeader && hoveredLeader !== selectedLeader;

    if (!active) {
      area.innerHTML = `<div class="half-empty"><div class="half-empty-icon">👑</div><div class="half-empty-label">Hover or select a leader</div></div>`;
      return;
    }

    const leader = leaders[active];
    const url    = PORTRAIT_URLS[active];
    const portraitInner = url
      ? `<img src="${escHtml(url)}" alt="${escHtml(active)}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
         <div class="detail-portrait-fallback" style="display:none">${escHtml(initials(active))}</div>`
      : `<div class="detail-portrait-fallback">${escHtml(initials(active))}</div>`;

    area.innerHTML = `
      ${isPreview ? `<div class="preview-badge">Preview — click to select</div>` : ''}
      <div class="detail-header">
        <div class="detail-portrait">${portraitInner}</div>
        <div>
          <div class="detail-name">${escHtml(active)}</div>
          <div class="ability-name-row">⚡ ${escHtml(leader.abilityName)}</div>
        </div>
      </div>
      <div class="ability-desc">${escHtml(leader.desc)}</div>`;
  }

  // ─── Render: Civ Detail (top-right half) ─────────────────────────────────────
  function renderCivDetail() {
    const area = document.getElementById('civ-detail-area');
    const active    = hoveredCiv ?? selectedCiv;
    const isPreview = !!hoveredCiv && hoveredCiv !== selectedCiv;

    if (!active) {
      area.innerHTML = `<div class="half-empty"><div class="half-empty-icon">🏛</div><div class="half-empty-label">Hover or select a civilization</div></div>`;
      return;
    }

    const civ = civs[active];
    const url = CIV_PORTRAIT_URLS[active];
    const portraitInner = url
      ? `<img src="${escHtml(url)}" alt="${escHtml(active)}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
         <div class="detail-portrait-fallback" style="display:none">${escHtml(initials(active))}</div>`
      : `<div class="detail-portrait-fallback" style="color:var(--teal)">${escHtml(initials(active))}</div>`;

    const traditions = civ.traditions.filter(t => {
      const a=(t.age||'').toLowerCase();
      return a!=='apex' && t.desc && t.desc.trim();
    });

    // Syncretism — only when both firmly selected and no hover active
    let syncHtml = '';
    const firmBoth = !isPreview && !(!!hoveredLeader && hoveredLeader!==selectedLeader) && selectedLeader && selectedCiv;
    if (firmBoth) {
      const leaderSyncSet = new Set(leaderSyncMap[selectedLeader]||[]);
      const civSyncSet    = new Set(civ.civSyncOptions);
      const allSync = new Set([...leaderSyncSet,...civSyncSet]);
      allSync.delete(selectedCiv);
      const pills = [...allSync].sort().map(n=>{
        const fl=leaderSyncSet.has(n), fc=civSyncSet.has(n);
        const cls=fl&&fc?'sync-pill from-both':fl?'sync-pill from-leader':'sync-pill';
        return `<span class="${cls}">${escHtml(n)}</span>`;
      }).join('');
      syncHtml = `
        <div class="section-sublabel">Syncretism</div>
        ${allSync.size>0
          ? `<div class="sync-pills">${pills}</div>
             <div class="sync-source-note">
               <span style="color:var(--gold-light)">Gold</span> = leader &nbsp;|&nbsp;
               <span style="color:var(--teal-light)">Teal</span> = civ &nbsp;|&nbsp;
               <span style="color:#d4c07a">Mixed</span> = both
             </div>`
          : `<div class="empty-state">No syncretism for this combination.</div>`}`;
    }

    area.innerHTML = `
      ${isPreview ? `<div class="preview-badge">Preview — click to select</div>` : ''}
      <div class="detail-header">
        <div class="detail-portrait civ-portrait">${portraitInner}</div>
        <div>
          <div class="detail-name">${escHtml(active)}</div>
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">${ageBadge(civ.apexAge)}</div>
          <div class="ability-name-row teal">⚡ ${escHtml(civ.abilityName)}</div>
        </div>
      </div>
      <div class="ability-desc">${escHtml(civ.apexDesc)}</div>
      ${traditions.length ? `
        <div class="section-sublabel">Cross-Age Traditions</div>
        ${traditions.map(t=>`
          <div class="tradition-row">
            <div style="padding-top:1px;flex-shrink:0">${ageBadge(t.age)}</div>
            <div>
              <div class="tradition-name">${escHtml(t.name)}</div>
              <div class="tradition-desc">${escHtml(t.desc)}</div>
            </div>
          </div>`).join('')}` : ''}
      ${syncHtml}`;
  }

  // ─── Render: Leader Grid ─────────────────────────────────────────────────────
  function renderLeaders() {
    const grid = document.getElementById('leader-grid');
    grid.innerHTML = '';
    for (const name of Object.keys(leaders).sort()) {
      const card = document.createElement('div');
      card.className = 'tile-card' + (selectedLeader===name ? ' leader-selected' : '');
      card.dataset.leader = name;

      const url = PORTRAIT_URLS[name];
      const portraitInner = url
        ? `<img src="${escHtml(url)}" alt="${escHtml(name)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="tile-fallback" style="display:none">${escHtml(initials(name))}</div>`
        : `<div class="tile-fallback">${escHtml(initials(name))}</div>`;

      card.innerHTML = `
        <div class="tile-portrait">${portraitInner}</div>
        <div class="tile-name">${escHtml(name)}</div>
        <div class="tile-check">
          <svg viewBox="0 0 12 10">
            <polyline points="1,5 4.5,8.5 11,1" stroke="#0f1320" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>`;

      card.addEventListener('click',      () => selectLeader(name));
      card.addEventListener('mouseenter', () => { hoveredLeader=name; renderLeaderDetail(); });
      card.addEventListener('mouseleave', () => { hoveredLeader=null; renderLeaderDetail(); });
      grid.appendChild(card);
    }
  }

  // ─── Render: Civ Grid ────────────────────────────────────────────────────────
  function renderCivs() {
    const grid = document.getElementById('civ-grid');
    grid.innerHTML = '';
    const leaderSyncCivs = new Set(leaderSyncMap[selectedLeader]||[]);

    for (const name of Object.keys(civs).sort()) {
      const civ = civs[name];
      const hasSync    = leaderSyncCivs.has(name);
      const isSelected = selectedCiv === name;

      const card = document.createElement('div');
      card.className = 'tile-card civ-card'
        + (isSelected ? ' civ-selected' : '')
        + (hasSync    ? ' has-syncretism' : '');
      card.dataset.civ = name;

      const url = CIV_PORTRAIT_URLS[name];
      const portraitInner = url
        ? `<img src="${escHtml(url)}" alt="${escHtml(name)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="tile-fallback" style="display:none;color:var(--teal)">${escHtml(initials(name))}</div>`
        : `<div class="tile-fallback" style="color:var(--teal)">${escHtml(initials(name))}</div>`;

      card.innerHTML = `
        <div class="tile-portrait" style="position:relative">
          ${portraitInner}
          ${hasSync ? `<div class="tile-sync-star" title="Leader can syncretise with this civ">✦</div>` : ''}
        </div>
        <div class="tile-name">${escHtml(name)}</div>
        <div class="tile-check">
          <svg viewBox="0 0 12 10">
            <polyline points="1,5 4.5,8.5 11,1" stroke="#0f1320" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>`;

      card.addEventListener('click',      () => selectCiv(name));
      card.addEventListener('mouseenter', () => { hoveredCiv=name; renderCivDetail(); });
      card.addEventListener('mouseleave', () => { hoveredCiv=null; renderCivDetail(); });
      grid.appendChild(card);
    }
  }

  // ─── Selection ───────────────────────────────────────────────────────────────
  function selectLeader(name) {
    selectedLeader=name; selectedCiv=null; hoveredLeader=null; hoveredCiv=null;
    renderLeaders(); renderCivs(); renderLeaderDetail(); renderCivDetail();
  }
  function selectCiv(name) {
    selectedCiv=name; hoveredCiv=null;
    document.querySelectorAll('.civ-card').forEach(c => c.classList.toggle('civ-selected', c.dataset.civ===name));
    renderCivDetail();
  }
  function resetAll() {
    selectedLeader=null; selectedCiv=null; hoveredLeader=null; hoveredCiv=null;
    renderLeaders(); renderCivs(); renderLeaderDetail(); renderCivDetail();
  }

  // ─── Init ─────────────────────────────────────────────────────────────────────
  async function init() {
    try {
      await loadData();
      processData();
      document.getElementById('loading').style.display='none';
      document.getElementById('app').style.display='flex';
      document.getElementById('btn-reset').addEventListener('click', resetAll);
      renderLeaders();
      renderCivs();
    } catch(err) {
      document.getElementById('loading').style.display='none';
      const el=document.getElementById('error-msg');
      el.style.display='block';
      el.textContent=`Failed to load data: ${err.message}. Make sure civ7_unified.csv and civ7_leader_syncretism.csv are alongside this file.`;
    }
  }

  init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civ VII — Leader &amp; Civ Ability Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:       #0f1320;
      --bg-panel:      #1a1f2e;
      --bg-card:       #212840;
      --bg-card-hover: #2a3255;
      --border:        #2e3554;
      --border-light:  #3d4a6e;
      --text:          #e8ecf4;
      --text-muted:    #8892b0;
      --text-dim:      #5a6380;
      --gold:          #c9a84c;
      --gold-light:    #e2c577;
      --gold-bg:       rgba(201,168,76,0.12);
      --teal:          #4ca89a;
      --teal-light:    #6ec8bb;
      --teal-bg:       rgba(76,168,154,0.12);
      --purple:        #8b5cf6;
      --purple-light:  #a78bfa;
      --purple-bg:     rgba(139,92,246,0.12);
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
      --radius-full: 9999px;
      --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
      --transition:  0.15s ease;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep); color: var(--text);
      display: flex; flex-direction: column;
    }

    /* ─── Loading ───────────────────────────────────────────── */
    #loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; gap: 20px; color: var(--text-muted);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Error ─────────────────────────────────────────────── */
    #error-msg {
      display: none; color: #f87171;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--radius-md);
      padding: 14px 18px; font-size: 0.8rem; margin: 16px;
    }

    /* ─── App Shell ─────────────────────────────────────────── */
    #app { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

    /* ─── Header ────────────────────────────────────────────── */
    .site-header {
      background: linear-gradient(135deg, #12172a 0%, #1a1f2e 60%, #16213a 100%);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .site-header h1 {
      font-size: 0.92rem; font-weight: 700;
      letter-spacing: 0.03em; color: var(--gold-light);
      display: flex; align-items: center; gap: 8px; white-space: nowrap; flex: 1; min-width: 0;
    }
    .site-header h1 .subtitle {
      font-size: 0.64rem; font-weight: 400;
      color: var(--text-muted); letter-spacing: 0.07em; text-transform: uppercase;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-reset {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 11px; background: transparent;
      border: 1px solid var(--border-light); border-radius: var(--radius-full);
      color: var(--text-muted); font-family: inherit;
      font-size: 0.64rem; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: border-color var(--transition), color var(--transition), background var(--transition);
      flex-shrink: 0;
    }
    .btn-reset:hover { border-color: var(--gold); color: var(--gold-light); background: var(--gold-bg); }
    .btn-reset svg { width: 10px; height: 10px; }

    /* ─── Tab Bar ────────────────────────────────────────────── */
    .tab-bar {
      display: flex; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
    }
    .tab-btn {
      flex: 1; padding: 11px 4px 9px;
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: inherit; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.03em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: color var(--transition), border-color var(--transition), background var(--transition);
    }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .tab-btn.active { color: var(--gold-light); border-bottom-color: var(--gold); }
    .tab-btn.active.teal-tab { color: var(--teal-light); border-bottom-color: var(--teal); }
    .tab-btn.active.abilities-tab { color: var(--purple-light); border-bottom-color: var(--purple); }

    /* selection dot badge on tab */
    .tab-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .tab-dot.gold { background: var(--gold); }
    .tab-dot.teal { background: var(--teal); }

    /* ─── Tab Panels ─────────────────────────────────────────── */
    .tab-panel {
      display: none; flex: 1; min-height: 0;
      flex-direction: column; overflow: hidden;
    }
    .tab-panel.active { display: flex; }

    .panel-scroll {
      flex: 1; overflow-y: auto; padding: 10px;
    }
    .panel-scroll::-webkit-scrollbar { width: 4px; }
    .panel-scroll::-webkit-scrollbar-track { background: transparent; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    /* ─── Tile Grid ──────────────────────────────────────────── */
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 5px;
    }

    /* ─── Tile Card (leaders & civs) ─────────────────────────── */
    .tile-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 6px 4px 5px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition),
                  background var(--transition), box-shadow var(--transition);
      position: relative; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tile-card:active {
      transform: scale(0.96);
    }
    .tile-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-light);
    }
    .tile-card.leader-selected {
      border-color: var(--gold);
      background: rgba(201,168,76,0.08);
      box-shadow: 0 0 0 1px var(--gold), var(--shadow-card);
    }
    .tile-card.civ-selected {
      border-color: var(--teal);
      background: rgba(76,168,154,0.08);
      box-shadow: 0 0 0 1px var(--teal), var(--shadow-card);
    }
    .tile-card.has-syncretism { border-color: rgba(201,168,76,0.35); }
    .tile-card.has-syncretism.civ-selected { border-color: var(--teal); }

    /* portrait */
    .tile-portrait {
      width: 52px; height: 52px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--border-light);
      transition: border-color var(--transition), box-shadow var(--transition);
      flex-shrink: 0; position: relative;
    }
    .civ-card .tile-portrait { border-radius: var(--radius-md); }
    .tile-card.leader-selected .tile-portrait { border-color: var(--gold); box-shadow: 0 0 10px rgba(201,168,76,0.3); }
    .tile-card.civ-selected    .tile-portrait { border-color: var(--teal); box-shadow: 0 0 10px rgba(76,168,154,0.25); }

    .tile-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .civ-card .tile-portrait img { object-position: center; }
    .tile-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg-card-hover), var(--border));
      font-size: 1rem; color: var(--gold); font-weight: 700;
    }
    .civ-card .tile-fallback { color: var(--teal); }

    .tile-name {
      font-size: 0.57rem; font-weight: 600;
      text-align: center; color: var(--text); line-height: 1.25;
      word-break: break-word; hyphens: auto;
    }

    /* syncretism badge on civ tile */
    .tile-sync-star {
      position: absolute; top: -3px; right: -3px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--gold); color: #0f1320;
      font-size: 0.44rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--bg-card);
    }

    /* selected checkmark */
    .tile-check {
      position: absolute; top: 4px; right: 4px;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--gold); display: none;
      align-items: center; justify-content: center;
    }
    .civ-card .tile-check { background: var(--teal); }
    .tile-card.leader-selected .tile-check,
    .tile-card.civ-selected    .tile-check { display: flex; }
    .tile-check svg { width: 7px; height: 7px; fill: #0f1320; }

    /* ─── Mini Ability Strip (top of Leaders & Civs tabs) ──────── */
    .mini-ability {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      overflow-y: auto;
      max-height: 36vh;
    }
    .mini-ability::-webkit-scrollbar { width: 3px; }
    .mini-ability::-webkit-scrollbar-track { background: transparent; }
    .mini-ability::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    .mini-ability-inner { padding: 10px 14px 12px; }

    .mini-empty {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      color: var(--text-dim); font-size: 0.66rem; font-style: italic;
    }
    .mini-empty-icon { font-size: 1rem; opacity: 0.3; }

    /* ─── Abilities Tab Content ───────────────────────────────── */
    .abilities-content { padding: 12px 14px 32px; max-width: 680px; }

    .ability-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .ability-card.leader-card-ability { border-left: 3px solid var(--gold); }
    .ability-card.civ-card-ability    { border-left: 3px solid var(--teal); }

    .ability-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .ability-portrait {
      width: 44px; height: 44px; border-radius: 50%;
      overflow: hidden; border: 2px solid var(--gold);
      box-shadow: 0 0 8px rgba(201,168,76,0.2); flex-shrink: 0;
    }
    .ability-portrait.civ { border-radius: var(--radius-md); border-color: var(--teal); box-shadow: 0 0 8px rgba(76,168,154,0.2); }
    .ability-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
    .ability-portrait.civ img { object-position: center; }
    .ability-portrait-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg-card-hover), var(--border));
      font-size: 0.9rem; font-weight: 700; color: var(--gold);
    }
    .ability-portrait.civ .ability-portrait-fallback { color: var(--teal); }

    .ability-entity-name { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 1px; }
    .ability-name {
      font-size: 0.68rem; font-weight: 600; color: var(--gold);
    }
    .ability-name.teal { color: var(--teal-light); }
    .ability-desc { font-size: 0.74rem; color: var(--text-muted); line-height: 1.65; white-space: pre-line; margin-top: 4px; }

    /* Age badge */
    .age-badge {
      display: inline-flex; align-items: center;
      padding: 1px 5px; border-radius: var(--radius-full);
      font-size: 0.54rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap;
    }
    .age-badge.antiquity  { background: var(--gold-bg);   color: var(--gold-light);   border: 1px solid rgba(201,168,76,0.3); }
    .age-badge.exploration{ background: var(--teal-bg);   color: var(--teal-light);   border: 1px solid rgba(76,168,154,0.3); }
    .age-badge.modern     { background: var(--purple-bg); color: var(--purple-light); border: 1px solid rgba(139,92,246,0.3); }

    /* Traditions */
    .section-sublabel {
      font-size: 0.56rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-dim); margin: 10px 0 5px;
    }
    .tradition-row {
      display: flex; align-items: flex-start; gap: 7px;
      padding: 6px 0; border-bottom: 1px solid var(--border);
    }
    .tradition-row:last-child { border-bottom: none; }
    .tradition-name { font-size: 0.7rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .tradition-desc { font-size: 0.65rem; color: var(--text-muted); line-height: 1.55; white-space: pre-line; }

    /* Syncretism */
    .sync-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
    .sync-pill {
      padding: 2px 8px; border-radius: var(--radius-full);
      font-size: 0.64rem; font-weight: 600;
      background: var(--teal-bg); color: var(--teal-light);
      border: 1px solid rgba(76,168,154,0.3);
    }
    .sync-pill.from-leader { background: rgba(201,168,76,0.1); color: var(--gold-light); border-color: rgba(201,168,76,0.3); }
    .sync-pill.from-both {
      background: linear-gradient(90deg, rgba(201,168,76,0.12), rgba(76,168,154,0.12));
      color: #d4c07a; border-color: rgba(201,168,76,0.4);
    }
    .sync-source-note { font-size: 0.6rem; color: var(--text-dim); margin-top: 5px; }
    .empty-state { font-size: 0.68rem; color: var(--text-dim); font-style: italic; }

    /* empty state in abilities tab */
    .abilities-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 24px; gap: 10px; text-align: center;
    }
    .abilities-empty-icon { font-size: 2rem; opacity: 0.2; }
    .abilities-empty-title { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    .abilities-empty-sub { font-size: 0.68rem; color: var(--text-dim); }
    .abilities-empty-action {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; margin-top: 4px;
      background: var(--gold-bg); border: 1px solid rgba(201,168,76,0.3);
      border-radius: var(--radius-full);
      color: var(--gold-light); font-size: 0.68rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: background var(--transition), border-color var(--transition);
    }
    .abilities-empty-action:hover { background: rgba(201,168,76,0.2); border-color: var(--gold); }
    .abilities-empty-action.teal {
      background: var(--teal-bg); border-color: rgba(76,168,154,0.3); color: var(--teal-light);
    }
    .abilities-empty-action.teal:hover { background: rgba(76,168,154,0.2); border-color: var(--teal); }

    /* ─── Civ panel legend ───────────────────────────────────── */
    .panel-legend {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px 4px;
      border-bottom: 1px solid var(--border);
      font-size: 0.56rem; color: var(--text-dim);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 3px; }
    .legend-swatch { width: 6px; height: 6px; border-radius: 1px; border: 1px solid var(--gold); }
    .sync-star-sm { font-size: 0.58rem; color: var(--gold); }

    /* ─── Footer ────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 6px 16px; text-align: center;
      font-size: 0.58rem; color: var(--text-dim); flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="loading"><div class="spinner"></div><span>Loading data…</span></div>
  <div id="error-msg"></div>

  <div id="app">

    <!-- ── Header ── -->
    <header class="site-header">
      <h1>⚔ Civ VII <span class="subtitle">— Leader &amp; Civ Ability Browser</span></h1>
      <button class="btn-reset" id="btn-reset">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.418A6 6 0 1 1 8 2v1z"/>
          <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
        </svg>
        Reset
      </button>
    </header>

    <!-- ── Tab Bar ── -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-leaders" data-tab="leaders">
        <span>Leaders</span>
        <span class="tab-dot gold" id="dot-leader" style="display:none"></span>
      </button>
      <button class="tab-btn teal-tab" id="tab-civs" data-tab="civs">
        <span>Civilizations</span>
        <span class="tab-dot teal" id="dot-civ" style="display:none"></span>
      </button>
      <button class="tab-btn abilities-tab" id="tab-abilities" data-tab="abilities">
        <span>Abilities</span>
      </button>
    </div>

    <!-- ── Leaders Panel ── -->
    <div class="tab-panel active" id="panel-leaders">
      <div class="mini-ability" id="leader-ability-strip">
        <div class="mini-empty"><span class="mini-empty-icon">👑</span> Select a leader to preview their ability here</div>
      </div>
      <div class="panel-scroll">
        <div class="tile-grid" id="leader-grid"></div>
      </div>
    </div>

    <!-- ── Civs Panel ── -->
    <div class="tab-panel" id="panel-civs">
      <div class="mini-ability" id="civ-ability-strip">
        <div class="mini-empty"><span class="mini-empty-icon">🏛</span> Select a civilization to preview their ability here</div>
      </div>
      <div class="panel-legend">
        <span class="legend-item"><span class="legend-swatch"></span> Syncretism available</span>
        <span class="legend-item"><span class="sync-star-sm">✦</span> Leader can sync</span>
      </div>
      <div class="panel-scroll">
        <div class="tile-grid" id="civ-grid"></div>
      </div>
    </div>

    <!-- ── Abilities Panel ── -->
    <div class="tab-panel" id="panel-abilities">
      <div class="panel-scroll">
        <div id="abilities-content"></div>
      </div>
    </div>

    <footer>
      Data extracted from Civ VII 1.4.0 (Test of Time) · Images © 2K Games via Civilization Wiki
    </footer>
  </div>

  <script>

  // ─── CSV Parser ──────────────────────────────────────────────────────────────
  function parseCSV(text) {
    const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    if (!lines.length) return [];
    const headers = parseCSVRow(lines[0]);
    const result = [];
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      const values = parseCSVRow(line);
      const row = {};
      headers.forEach((h, idx) => { row[h] = values[idx] !== undefined ? values[idx] : ''; });
      result.push(row);
    }
    return result;
  }
  function parseCSVRow(line) {
    const result = []; let cur = ''; let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
        else { inQuote = !inQuote; }
      } else if (ch === ',' && !inQuote) { result.push(cur); cur = ''; }
      else { cur += ch; }
    }
    result.push(cur);
    return result;
  }

  // ─── Helpers ─────────────────────────────────────────────────────────────────
  function ageClass(age) {
    const a = (age||'').toLowerCase();
    return a==='antiquity'?'antiquity':a==='exploration'?'exploration':a==='modern'?'modern':'';
  }
  function ageBadge(age) {
    if (!age) return '';
    return `<span class="age-badge ${ageClass(age)}">${escHtml(age)}</span>`;
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function splitList(str) {
    if (!str||!str.trim()) return [];
    return str.split(',').map(s=>s.trim()).filter(Boolean);
  }
  function initials(name) {
    return name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  }

  // ─── State ───────────────────────────────────────────────────────────────────
  let allRows=[], leaderSyncRows=[];
  let leaders={}, civs={}, leaderSyncMap={};
  let selectedLeader=null, selectedCiv=null;
  let activeTab='leaders';

  // ─── Load & Process ──────────────────────────────────────────────────────────
  async function loadData() {
    const [u, s] = await Promise.all([
      fetch('civ7_unified.csv').then(r=>{ if(!r.ok) throw new Error(r.statusText); return r.text(); }),
      fetch('civ7_leader_syncretism.csv').then(r=>{ if(!r.ok) throw new Error(r.statusText); return r.text(); }),
    ]);
    allRows=parseCSV(u); leaderSyncRows=parseCSV(s);
  }
  function processData() {
    for (const row of allRows) {
      if (row.kind!=='leader'||row.row_type!=='Unique Ability') continue;
      leaders[row.name]={ abilityName:row.ability_or_tradition_name, desc:row.description_clean, syncretismOptions:splitList(row.syncretism_options) };
    }
    for (const row of allRows) {
      if (row.kind!=='civilization') continue;
      if (!civs[row.name]) civs[row.name]={ abilityName:'', apexDesc:'', apexAge:APEX_AGES[row.name]||'', traditions:[], civSyncOptions:[] };
      if (row.row_type==='Unique Ability') {
        civs[row.name].abilityName=row.ability_or_tradition_name;
        civs[row.name].apexDesc=row.description_clean;
        civs[row.name].civSyncOptions=splitList(row.syncretism_options);
      } else if (row.row_type==='Self-Syncretism Tradition') {
        civs[row.name].traditions.push({ name:row.ability_or_tradition_name, age:row.age, desc:row.description_clean });
      }
    }
    const AGE_ORDER={Antiquity:0,Exploration:1,Apex:2,Modern:3};
    for (const civ of Object.values(civs)) civ.traditions.sort((a,b)=>(AGE_ORDER[a.age]??99)-(AGE_ORDER[b.age]??99));
    for (const row of leaderSyncRows) {
      if (!leaderSyncMap[row.leader_name]) leaderSyncMap[row.leader_name]=[];
      leaderSyncMap[row.leader_name].push(row.syncretism_civ_name);
    }
  }

  // ─── Tab Switching ───────────────────────────────────────────────────────────
  function setTab(name) {
    activeTab = name;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===name));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id===`panel-${name}`));
  }

  // ─── Render: Mini Ability Strips ─────────────────────────────────────────────
  function renderLeaderStrip() {
    const strip = document.getElementById('leader-ability-strip');
    if (!selectedLeader) {
      strip.innerHTML = `<div class="mini-empty"><span class="mini-empty-icon">👑</span> Select a leader to preview their ability here</div>`;
      return;
    }
    const leader = leaders[selectedLeader];
    const url    = PORTRAIT_URLS[selectedLeader];
    const portraitInner = url
      ? `<img src="${escHtml(url)}" alt="${escHtml(selectedLeader)}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
         <div class="ability-portrait-fallback" style="display:none">${escHtml(initials(selectedLeader))}</div>`
      : `<div class="ability-portrait-fallback">${escHtml(initials(selectedLeader))}</div>`;
    strip.innerHTML = `<div class="mini-ability-inner">
      <div class="ability-card-header">
        <div class="ability-portrait">${portraitInner}</div>
        <div>
          <div class="ability-entity-name">${escHtml(selectedLeader)}</div>
          <div class="ability-name">⚡ ${escHtml(leader.abilityName)}</div>
        </div>
      </div>
      <div class="ability-desc">${escHtml(leader.desc)}</div>
    </div>`;
  }

  function renderCivStrip() {
    const strip = document.getElementById('civ-ability-strip');
    if (!selectedCiv) {
      strip.innerHTML = `<div class="mini-empty"><span class="mini-empty-icon">🏛</span> Select a civilization to preview their ability here</div>`;
      return;
    }
    const civ = civs[selectedCiv];
    const url = CIV_PORTRAIT_URLS[selectedCiv];
    const portraitInner = url
      ? `<img src="${escHtml(url)}" alt="${escHtml(selectedCiv)}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
         <div class="ability-portrait-fallback" style="display:none">${escHtml(initials(selectedCiv))}</div>`
      : `<div class="ability-portrait-fallback">${escHtml(initials(selectedCiv))}</div>`;
    const traditions = civ.traditions.filter(t => {
      const a=(t.age||'').toLowerCase();
      return a!=='apex' && t.desc && t.desc.trim();
    });
    strip.innerHTML = `<div class="mini-ability-inner">
      <div class="ability-card-header">
        <div class="ability-portrait civ">${portraitInner}</div>
        <div>
          <div class="ability-entity-name">${escHtml(selectedCiv)}</div>
          <div style="margin-bottom:3px">${ageBadge(civ.apexAge)}</div>
          <div class="ability-name teal">⚡ ${escHtml(civ.abilityName)}</div>
        </div>
      </div>
      <div class="ability-desc">${escHtml(civ.apexDesc)}</div>
      ${traditions.length ? `
        <div class="section-sublabel">Cross-Age Traditions</div>
        ${traditions.map(t=>`
          <div class="tradition-row">
            <div style="padding-top:1px;flex-shrink:0">${ageBadge(t.age)}</div>
            <div>
              <div class="tradition-name">${escHtml(t.name)}</div>
              <div class="tradition-desc">${escHtml(t.desc)}</div>
            </div>
          </div>`).join('')}` : ''}
    </div>`;
  }

  // ─── Render: Leader Grid ─────────────────────────────────────────────────────
  function renderLeaderGrid() {
    const grid = document.getElementById('leader-grid');
    grid.innerHTML = '';
    for (const name of Object.keys(leaders).sort()) {
      const card = document.createElement('div');
      card.className = 'tile-card' + (selectedLeader===name ? ' leader-selected' : '');
      card.dataset.leader = name;

      const url = PORTRAIT_URLS[name];
      const inner = url
        ? `<img src="${escHtml(url)}" alt="${escHtml(name)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="tile-fallback" style="display:none">${escHtml(initials(name))}</div>`
        : `<div class="tile-fallback">${escHtml(initials(name))}</div>`;

      card.innerHTML = `
        <div class="tile-portrait">${inner}</div>
        <div class="tile-name">${escHtml(name)}</div>
        <div class="tile-check">
          <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,8.5 11,1" stroke="#0f1320" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>`;

      card.addEventListener('click', () => selectLeader(name));
      grid.appendChild(card);
    }
  }

  // ─── Render: Civ Grid ────────────────────────────────────────────────────────
  function renderCivGrid() {
    const grid = document.getElementById('civ-grid');
    grid.innerHTML = '';
    const syncCivs = new Set(leaderSyncMap[selectedLeader]||[]);

    for (const name of Object.keys(civs).sort()) {
      const civ = civs[name];
      const hasSync    = syncCivs.has(name);
      const isSelected = selectedCiv === name;

      const card = document.createElement('div');
      card.className = 'tile-card civ-card'
        + (isSelected ? ' civ-selected' : '')
        + (hasSync    ? ' has-syncretism' : '');
      card.dataset.civ = name;

      const url = CIV_PORTRAIT_URLS[name];
      const inner = url
        ? `<img src="${escHtml(url)}" alt="${escHtml(name)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="tile-fallback" style="display:none;color:var(--teal)">${escHtml(initials(name))}</div>`
        : `<div class="tile-fallback" style="color:var(--teal)">${escHtml(initials(name))}</div>`;

      card.innerHTML = `
        <div class="tile-portrait" style="position:relative">
          ${inner}
          ${hasSync ? `<div class="tile-sync-star">✦</div>` : ''}
        </div>
        <div class="tile-name">${escHtml(name)}</div>
        <div class="tile-check">
          <svg viewBox="0 0 12 10"><polyline points="1,5 4.5,8.5 11,1" stroke="#0f1320" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>`;

      card.addEventListener('click', () => selectCiv(name));
      grid.appendChild(card);
    }
  }

  // ─── Render: Abilities Tab ────────────────────────────────────────────────────
  function renderAbilitiesTab() {
    const area = document.getElementById('abilities-content');

    if (!selectedLeader && !selectedCiv) {
      area.innerHTML = `
        <div class="abilities-empty">
          <div class="abilities-empty-icon">⚔</div>
          <div class="abilities-empty-title">Nothing selected yet</div>
          <div class="abilities-empty-sub">Choose a leader and civilization to see their combined abilities here.</div>
          <button class="abilities-empty-action" onclick="setTab('leaders')">Go to Leaders →</button>
        </div>`;
      return;
    }

    let html = '<div class="abilities-content">';

    // ── Leader card ──
    if (selectedLeader) {
      const leader = leaders[selectedLeader];
      const url = PORTRAIT_URLS[selectedLeader];
      const portraitInner = url
        ? `<img src="${escHtml(url)}" alt="${escHtml(selectedLeader)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="ability-portrait-fallback" style="display:none">${escHtml(initials(selectedLeader))}</div>`
        : `<div class="ability-portrait-fallback">${escHtml(initials(selectedLeader))}</div>`;

      html += `
        <div class="ability-card leader-card-ability">
          <div class="ability-card-header">
            <div class="ability-portrait">${portraitInner}</div>
            <div>
              <div class="ability-entity-name">${escHtml(selectedLeader)}</div>
              <div class="ability-name">⚡ ${escHtml(leader.abilityName)}</div>
            </div>
          </div>
          <div class="ability-desc">${escHtml(leader.desc)}</div>
        </div>`;
    } else {
      html += `
        <div class="abilities-empty" style="padding:20px 0 10px">
          <div class="abilities-empty-sub">No leader selected.</div>
          <button class="abilities-empty-action" onclick="setTab('leaders')">Choose a Leader →</button>
        </div>`;
    }

    // ── Civ card ──
    if (selectedCiv) {
      const civ = civs[selectedCiv];
      const url = CIV_PORTRAIT_URLS[selectedCiv];
      const portraitInner = url
        ? `<img src="${escHtml(url)}" alt="${escHtml(selectedCiv)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
           <div class="ability-portrait-fallback" style="display:none">${escHtml(initials(selectedCiv))}</div>`
        : `<div class="ability-portrait-fallback">${escHtml(initials(selectedCiv))}</div>`;

      const traditions = civ.traditions.filter(t => {
        const a=(t.age||'').toLowerCase();
        return a!=='apex' && t.desc && t.desc.trim();
      });

      html += `
        <div class="ability-card civ-card-ability">
          <div class="ability-card-header">
            <div class="ability-portrait civ">${portraitInner}</div>
            <div>
              <div class="ability-entity-name">${escHtml(selectedCiv)}</div>
              <div style="margin-bottom:3px">${ageBadge(civ.apexAge)}</div>
              <div class="ability-name teal">⚡ ${escHtml(civ.abilityName)}</div>
            </div>
          </div>
          <div class="ability-desc">${escHtml(civ.apexDesc)}</div>
          ${traditions.length ? `
            <div class="section-sublabel">Cross-Age Traditions</div>
            ${traditions.map(t=>`
              <div class="tradition-row">
                <div style="padding-top:1px;flex-shrink:0">${ageBadge(t.age)}</div>
                <div>
                  <div class="tradition-name">${escHtml(t.name)}</div>
                  <div class="tradition-desc">${escHtml(t.desc)}</div>
                </div>
              </div>`).join('')}` : ''}
        </div>`;
    } else {
      html += `
        <div class="abilities-empty" style="padding:20px 0 10px">
          <div class="abilities-empty-sub">No civilization selected.</div>
          <button class="abilities-empty-action teal" onclick="setTab('civs')">Choose a Civilization →</button>
        </div>`;
    }

    // ── Syncretism (both selected) ──
    if (selectedLeader && selectedCiv) {
      const civ = civs[selectedCiv];
      const leaderSyncSet = new Set(leaderSyncMap[selectedLeader]||[]);
      const civSyncSet    = new Set(civ.civSyncOptions);
      const allSync = new Set([...leaderSyncSet,...civSyncSet]);
      allSync.delete(selectedCiv);

      const pills = [...allSync].sort().map(n => {
        const fl=leaderSyncSet.has(n), fc=civSyncSet.has(n);
        const cls=fl&&fc?'sync-pill from-both':fl?'sync-pill from-leader':'sync-pill';
        return `<span class="${cls}">${escHtml(n)}</span>`;
      }).join('');

      html += `
        <div class="ability-card">
          <div class="section-sublabel" style="margin-top:0">Syncretism Options</div>
          ${allSync.size>0
            ? `<div class="sync-pills">${pills}</div>
               <div class="sync-source-note">
                 <span style="color:var(--gold-light)">Gold</span> = from leader &nbsp;|&nbsp;
                 <span style="color:var(--teal-light)">Teal</span> = from civilization &nbsp;|&nbsp;
                 <span style="color:#d4c07a">Mixed</span> = both
               </div>`
            : `<div class="empty-state">No syncretism options for this combination.</div>`}
        </div>`;
    }

    html += '</div>';
    area.innerHTML = html;
  }

  // ─── Update Tab Dots ─────────────────────────────────────────────────────────
  function updateDots() {
    document.getElementById('dot-leader').style.display = selectedLeader ? '' : 'none';
    document.getElementById('dot-civ').style.display    = selectedCiv    ? '' : 'none';
  }

  // ─── Selection ───────────────────────────────────────────────────────────────
  function selectLeader(name) {
    selectedLeader = name;
    selectedCiv    = null;
    document.querySelectorAll('.tile-card[data-leader]').forEach(c =>
      c.classList.toggle('leader-selected', c.dataset.leader===name));
    renderCivGrid();
    renderLeaderStrip();
    renderCivStrip();
    renderAbilitiesTab();
    updateDots();
  }

  function selectCiv(name) {
    selectedCiv = name;
    document.querySelectorAll('.tile-card[data-civ]').forEach(c =>
      c.classList.toggle('civ-selected', c.dataset.civ===name));
    renderCivStrip();
    renderAbilitiesTab();
    updateDots();
  }

  function resetAll() {
    selectedLeader=null; selectedCiv=null;
    document.querySelectorAll('.tile-card').forEach(c => c.classList.remove('leader-selected','civ-selected'));
    renderCivGrid();
    renderLeaderStrip();
    renderCivStrip();
    renderAbilitiesTab();
    updateDots();
    setTab('leaders');
  }

  // ─── Init ─────────────────────────────────────────────────────────────────────
  async function init() {
    try {
      await loadData();
      processData();
      document.getElementById('loading').style.display='none';
      document.getElementById('app').style.display='flex';

      document.querySelectorAll('.tab-btn').forEach(btn =>
        btn.addEventListener('click', () => setTab(btn.dataset.tab)));
      document.getElementById('btn-reset').addEventListener('click', resetAll);

      renderLeaderGrid();
      renderCivGrid();
      renderAbilitiesTab();
    } catch(err) {
      document.getElementById('loading').style.display='none';
      const el=document.getElementById('error-msg');
      el.style.display='block';
      el.textContent=`Failed to load data: ${err.message}. Make sure civ7_unified.csv and civ7_leader_syncretism.csv are alongside this file.`;
    }
  }

  init();
  </script>
</body>
</html>
